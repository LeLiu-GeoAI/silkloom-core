[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silkloom-core"
version = "7.1.0"
description = "A lightweight pandas accessor for batch OpenAI-compatible LLM extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "jinja2>=3.1.0",
  "json-repair>=0.39.1",
  "pandas>=2.0",
]
authors = [
  { name = "SilkLoom Core Contributors" }
]
license = "MIT"
keywords = ["llm", "pipeline", "workflow", "batch-processing", "pandas", "silkloom"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
progress = [
  "tqdm>=4.66.0",
]
dev = [
  "build>=1.2.1",
  "pytest>=8.0",
  "twine>=5.1.1",
]

[tool.setuptools.packages.find]
include = ["silkloom_core*"]

[tool.setuptools.package-data]
silkloom_core = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
